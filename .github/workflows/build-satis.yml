name: Build Satis Repository

on:
  workflow_dispatch:
  push:
    branches: ["main"]

# Permissões necessárias para o GITHUB_TOKEN funcionar no deploy
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PHP 8.4 and Composer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt-get update
          sudo apt-get install -y php8.4 php8.4-cli php8.4-mbstring php8.4-xml php8.4-curl php8.4-zip unzip curl
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Install Satis
        run: composer create-project composer/satis --stability=dev --keep-vcs

      - name: Build Satis
        run: php satis/bin/satis build satis.json web/
        env:
          # Usa o PAT personalizado para ler os repositórios privados
          COMPOSER_AUTH: | 
            {"github-oauth": {"github.com": "${{ secrets.SATIS_GITHUB_TOKEN }}"}}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Usamos o PAT (SATIS_GITHUB_TOKEN) para garantir permissão de escrita no deploy
          personal_token: ${{ secrets.SATIS_GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true
          external_repository: SplitPayBrasil/v2-shizuku
          publish_branch: gh-pages